  <style>
    /* Loading screen */
    body {
      margin: 0;
      background: #0D0D1A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, serif;
    }
    #loading {
      text-align: center;
      color: rgba(255,255,255,0.7);
    }
    #loading-title {
      font-size: 1.5rem;
      color: white;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }
    #loading-sub {
      font-size: 0.85rem;
      color: rgba(155, 89, 182, 0.8);
      font-style: italic;
    }
    .loading-bar {
      width: 120px;
      height: 2px;
      background: rgba(255,255,255,0.1);
      border-radius: 1px;
      margin: 1.5rem auto 0;
      overflow: hidden;
    }
    .loading-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #9B59B6, #E8A0BF);
      border-radius: 1px;
      animation: loadingAnim 1.5s ease-in-out infinite;
    }
    @keyframes loadingAnim {
      0% { width: 0%; margin-left: 0%; }
      50% { width: 70%; margin-left: 15%; }
      100% { width: 0%; margin-left: 100%; }
    }
    .flutter-loader { display: none; }
  </style>
</head>
<body>
  <div id="loading">
    <div id="loading-title">Yuragdagi Sukut</div>
    <div id="loading-sub">— O'zbek sevgi romani —</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('loading').style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
