name: 🚀 Deploy Flutter Web → yurakdaagi-sukut.com

on:
  push:
    branches:
      - yuragdagi-sukut

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build va Deploy

    steps:
      # 1. Kodni yuklab olish
      - name: 📥 Kodni checkout qilish
        uses: actions/checkout@v4

      # 2. Flutter o'rnatish
      - name: 🐦 Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # 3. Paketlar
      - name: 📦 Paketlarni o'rnatish
        run: flutter pub get

      # 4. Web build
      - name: 🔨 Flutter Web build
        run: flutter build web --release --base-href "/"

      # 5. CNAME nusxalash
      - name: 🌐 CNAME faylini qo'shish
        run: cp web/CNAME build/web/CNAME

      # 6. GitHub Pages ga deploy
      - name: 🚀 GitHub Pages ga deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          cname: yurakdaagi-sukut.com
          commit_message: "deploy: ${{ github.sha }} — yurakdaagi-sukut.com"
          force_orphan: true
